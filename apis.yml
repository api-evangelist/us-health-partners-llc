name: US Health Partners, LLC
description: 'US Health Partners (USHP) is a physician-led national cardiovascular
  care network headquartered in Rockville, Maryland. USHP partners with independent
  cardiology practices across the country, providing management support, clinical
  governance, and technology while practices remain independent — reporting roughly
  800 team members, 525K patients, and 30 locations. The company is backed by Bessemer
  Venture Partners, Summit Partners, and Silversmith Capital Partners. USHP publishes
  no public developer portal or API surface as of July 2026.'
